name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Config::VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION="$(grep -oP "public const VERSION = '\K[^']+" src/Config.php)"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Config::VERSION (${CODE_VERSION}). Bump src/Config.php before tagging."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches Config::VERSION ${CODE_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
